<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBKR Portfolio Manager</title>
    <script>
      // Apply the saved appearance before React loads, so dark mode doesn't flash light first.
      // Same rules as useAppearance in src/hooks/appearance.js.
      ;(function () {
        var choice = 'system'
        try {
          choice = localStorage.getItem('appearance') || 'system'
        } catch (e) {}
        var dark =
          choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
