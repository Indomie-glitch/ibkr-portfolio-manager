[package]
name = "portfolio-manager"
version = "0.1.0"
description = "Portfolio Manager: a Mac app for an Interactive Brokers portfolio"
authors = ["Aarnav Tulsian"]
license = ""
repository = "https://github.com/Indomie-glitch/ibkr-portfolio-manager"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "portfolio_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
libc = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Moving the window buttons (traffic_lights.rs); the same versions Tauri already uses
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
# Touch ID or the Mac password before allowing borrowing (borrowing.rs)
objc2-local-authentication = { version = "0.3", features = ["std", "block2", "LAContext", "LAError"] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSError"] }
block2 = "0.6"

[target.'cfg(unix)'.dependencies]
# Encrypting the remembered Anthropic key (keystore.rs)
chacha20poly1305 = "0.10"
